# fantasm project configuration. See docs/configuration.md for the schema.

[project]
name = "voltmace-delta-14b-driver"

[binary]
# These are not ROMs but *RUN programs loaded into main memory at &1900.
# NMOS 6502 (BBC Model B, early-1980s software), so cpu = "6502".
# base_address is documentary here; the driver's d.load() sets the real org.
cpu = "6502"
base_address = 0x1900
# The artefacts are plain program binaries, not ROM images: keep them in a
# neutrally-named binary/ directory with no file extension (matching the
# original DFS names, e.g. KEYPAD) and a binary.json metadata file.
dir = "binary"
extension = ""
metadata = "binary.json"
# Keep the original Acorn DFS filenames (KEYPAD, JOYSTIK). The version ids are
# their lower-case forms, so the upper-cased id is the DFS name; the KEYPAD.inf
# / JOYSTIK.inf sidecars sit beside each binary as a valid DFS pair.
filename = "{version_id_upper}"

[versions]
prefixes = ["voltmace-delta-14b-driver"]
# The prefix is hyphenated, but a driver-script filename must be a valid
# Python identifier, so map hyphens to underscores explicitly.
driver_filename = "disasm_voltmace_delta_14b_driver_{version_id_no_dots}.py"

# The Delta 14B driver disc (release 1) ships two distinct programs; each is
# modelled as its own fantasm "version".
[[versions.entry]]
id = "keypad"

[[versions.entry]]
id = "joystik"
