# fantasm project configuration. See docs/configuration.md for the schema.

[project]
name = "voltmace-delta-14b-driver"

[rom]
# These binaries are not ROMs but *RUN programs loaded into main memory at
# &1900. NMOS 6502 (BBC Model B, early-1980s software), so cpu = "6502".
# base_address is documentary here; the driver's d.load() sets the real org.
cpu = "6502"
base_address = 0x1900

[versions]
prefixes = ["voltmace-delta-14b-driver"]
# The prefix is hyphenated, but a driver-script filename must be a valid
# Python identifier, so map hyphens to underscores explicitly.
driver_filename = "disasm_voltmace_delta_14b_driver_{version_id_no_dots}.py"

# The Delta 14B driver disc (release 1) ships two distinct programs; each is
# modelled as its own fantasm "version".
[[versions.entry]]
id = "keypad"

[[versions.entry]]
id = "joystik"
